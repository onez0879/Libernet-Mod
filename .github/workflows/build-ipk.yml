name: Build Libernet-Mod IPK

on:
  push:
    branches: [main]
    paths:
      - "package/libernet-mod/**"
      - ".github/workflows/build-ipk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: OpenWrt 24.10 ARM64 package
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      SDK_URL: https://downloads.openwrt.org/releases/24.10.0/targets/armsr/armv8/openwrt-sdk-24.10.0-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst
      SDK_DIR: openwrt-sdk-24.10.0-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd file

      - name: Download OpenWrt SDK
        run: |
          set -euxo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            "$SDK_URL" \
            --output sdk.tar.zst

          tar --use-compress-program=unzstd -xf sdk.tar.zst
          test -d "$SDK_DIR"

      - name: Add package source
        run: |
          set -eux

          mkdir -p "$SDK_DIR/package/libernet-mod"
          cp -a package/libernet-mod/. \
            "$SDK_DIR/package/libernet-mod/"

      - name: Update feeds
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -eux
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build IPK
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -eux

          make defconfig

          make package/libernet-mod/compile \
            V=s \
            -j"$(nproc)"

      - name: Inspect package
        run: |
          set -eux

          mkdir -p artifacts

          find "$SDK_DIR/bin/packages" \
            -type f \
            -name 'libernet-mod_*.ipk' \
            -print \
            -exec cp {} artifacts/ \;

          echo "=== Generated IPK ==="
          ls -lah artifacts

          echo "=== Package architecture ==="
          file artifacts/*.ipk

          test -n "$(find artifacts -name 'libernet-mod_*.ipk' -print -quit)"

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: libernet-mod-ipk-openwrt-24.10-arm64
          path: artifacts/*.ipk
          if-no-files-found: error
          retention-days: 30
