name: Build Libernet-Mod IPK

on:
  push:
    branches: [main]
    paths:
      - "package/libernet-mod/**"
      - ".github/workflows/build-ipk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Libernet-Mod ARM64 IPK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            rsync \
            unzip \
            file \
            zstd \
            wget

      - name: Download OpenWrt SDK
        env:
          SDK_URL: https://downloads.openwrt.org/releases/24.10.0/targets/armsr/armv8/openwrt-sdk-24.10.0-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          SDK_DIR: openwrt-sdk-24.10.0-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64
        run: |
          wget -q --show-progress "$SDK_URL" -O sdk.tar.zst
          tar --use-compress-program=unzstd -xf sdk.tar.zst

      - name: Copy Libernet-Mod package
        env:
          SDK_DIR: openwrt-sdk-24.10.0-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64
        run: |
          rm -rf "$SDK_DIR/package/libernet-mod"
          mkdir -p "$SDK_DIR/package/libernet-mod"
          cp -a package/libernet-mod/. "$SDK_DIR/package/libernet-mod/"

      - name: Build Libernet-Mod
        env:
          SDK_DIR: openwrt-sdk-24.10.0-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64
        run: |
          cd "$SDK_DIR"
          make defconfig
          make package/libernet-mod/compile V=s -j2

      - name: Find IPK
        run: |
          echo "=== Built packages ==="
          find . -type f -name "libernet-mod_*.ipk" -print

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: libernet-mod-ipk
          path: |
            **/libernet-mod_*.ipk
